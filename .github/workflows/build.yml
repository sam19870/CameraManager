name: 打包签名ReleaseAPK
on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build_apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 配置JDK17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: 赋予脚本权限
        run: chmod +x ./gradlew

      - name: 编译签名release包
        run: ./gradlew assembleRelease

      - name: 上传APK
        uses: actions/upload-artifact@v4
        with:
          name:已签名APK
          path: app/build/outputs/apk/release/app-release.apk
